<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">
  <title>EchoTales | Lost - Contents</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">E C H O T A L E S | L O S T</div>
  <div class="sub-header">CONTENTS</div>

  <div class="section">
    <div class="card">
      <img src="images/image1.png" alt="Chapter Card">
    </div>
    <div class="description-box">
      <strong>Card Type: CHAPTER</strong><br><br>
      • 3 x Chapter Cards<br>
      • Picture holds the secret<br>
      • Hear the story: Scan the QR code
    </div>
  </div>

  <div class="section reverse">
    <div class="card">
      <img src="images/image2.png" alt="Fragment Card">
    </div>
    <div class="description-box">
      <strong>Card Type: FRAGMENT</strong><br><br>
      • 9 x Fragment Cards<br>
      • Picture holds the secret<br>
      • Hear the story: Scan the QR code
    </div>
  </div>

  <button class="start-button">START NOW</button>
</body>
</html>
